[features]
seeds = false
skip-lint = false

[programs.localnet]
parlay_system = "CS2ParlayBettingSystemV1"

[programs.devnet]
parlay_system = "CS2ParlayBettingSystemV1"

[programs.mainnet]
parlay_system = "CS2ParlayBettingSystemV1"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[[test.genesis]]
address = "CS2ParlayBettingSystemV1"
program = "target/deploy/parlay_system.so"

[test.validator]
url = "https://api.devnet.solana.com"
startup_wait = 5000
shutdown_wait = 2000

[[test.validator.clone]]
address = "9BZJXtmfPpkHnM57gHEx5Pc9oQhLhJtr4mhCsNtttTts"