[phases.setup]
nixPkgs = ["nodejs_18", "npm-9_x"]

[phases.install]
cmds = ["cd backend && npm ci --production=false"]

[phases.build]
cmds = ["cd backend && echo 'Build phase completed'"]

[start]
cmd = "cd backend && node server-minimal.js"

[variables]
NODE_ENV = "production"
NPM_CONFIG_PRODUCTION = "false"